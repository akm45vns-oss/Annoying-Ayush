name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Principle of least privilege: default read-only permissions across workflow
permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for publishing release artifacts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Generate Production Release Keystore
        id: keystore
        env:
          KEY_PASS: ${{ secrets.ANDROID_RELEASE_PASSWORD || 'AnnoyingAyushProductionSecured2026' }}
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias annoyingayush \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEY_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Annoying Ayush, OU=Mobile Games, O=Personal, L=Varanasi, ST=UP, C=IN"
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=annoyingayush" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

      - name: Build Android Release APK with Gradle (Minified & Proguarded)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/Annoying-Ayush.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Annoying-Ayush-APK
          path: output/Annoying-Ayush.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: "Annoying Ayush Android APK"
          body: |
            ### 📱 Annoying Ayush Native Android APK (Release Build)
            
            Production-ready, minified and secured release APK for Android phones and tablets.
            
            **How to install on Android:**
            1. Tap `Annoying-Ayush.apk` below to download directly to your phone.
            2. Tap the downloaded `.apk` file to install.
            3. If prompted, allow "Install unknown apps" from Settings.
          files: output/Annoying-Ayush.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
